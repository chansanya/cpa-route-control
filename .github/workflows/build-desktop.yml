name: Build Desktop Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选，默认读取 package.json 版本"
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows bundles
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect Windows artifacts
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'cpa-route-control-windows-x64'
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $portable = 'src-tauri/target/x86_64-pc-windows-msvc/release/cpa-route-control-desktop.exe'
          if (-not (Test-Path -LiteralPath $portable)) {
            throw "Portable executable was not generated: $portable"
          }
          Copy-Item -LiteralPath $portable -Destination (Join-Path $output 'CPA-Route-Control-portable.exe')

          $installers = Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File
          if ($installers.Count -eq 0) {
            throw 'NSIS installer was not generated.'
          }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination $output
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPA-Route-Control-windows-x64
          path: ${{ runner.temp }}/cpa-route-control-windows-x64/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri macOS bundles
        run: npm run tauri build -- --bundles app,dmg

      - name: Collect macOS artifacts
        run: |
          output="$RUNNER_TEMP/cpa-route-control-macos"
          mkdir -p "$output"

          app_dir="src-tauri/target/release/bundle/macos"
          if [ ! -d "$app_dir" ]; then
            echo "macOS app bundle was not generated."
            exit 1
          fi

          find "$app_dir" -maxdepth 2 -name "*.app" -exec cp -R {} "$output/" \;
          find "$app_dir" -maxdepth 2 -name "*.dmg" -exec cp {} "$output/" \;

          if [ -z "$(ls -A "$output")" ]; then
            echo "No macOS artifacts were collected."
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPA-Route-Control-macos
          path: ${{ runner.temp }}/cpa-route-control-macos/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          echo "Publishing release: $VERSION"
          gh release create "$VERSION" \
            release-artifacts/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes || \
          gh release upload "$VERSION" \
            release-artifacts/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
