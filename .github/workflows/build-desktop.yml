name: Build Desktop Releases

# 触发条件：
# 1. 手动在 GitHub Actions 页面运行；
# 2. 推送到 master；
# 3. 推送 v* 版本标签。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选，默认读取 package.json 版本"
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

# 同一分支或标签的构建只保留最新一次，避免并发重复构建。
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    # Windows 任务使用 PowerShell。
    defaults:
      run:
        shell: pwsh

    steps:
      # 拉取当前仓库代码。
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Node.js 22，后续 Vite 构建依赖它。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 安装 Rust，并指定 Windows x64 目标。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 缓存 Rust 依赖，加快后续构建。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 安装前端 npm 依赖。
      - name: Install frontend dependencies
        run: npm ci

      # 使用 Tauri 构建 Windows NSIS 安装包。
      - name: Build Tauri Windows bundles
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      # 收集生成的便携 EXE 和安装包，统一放到临时目录。
      - name: Collect Windows artifacts
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'cpa-route-control-windows-x64'
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $portable = 'src-tauri/target/x86_64-pc-windows-msvc/release/cpa-route-control-desktop.exe'
          if (-not (Test-Path -LiteralPath $portable)) {
            throw "Portable executable was not generated: $portable"
          }
          Copy-Item -LiteralPath $portable -Destination (Join-Path $output 'CPA-Route-Control-portable.exe')

          $installers = Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File
          if ($installers.Count -eq 0) {
            throw 'NSIS installer was not generated.'
          }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination $output
          }

      # 将 EXE 产物上传到 Actions Artifacts，供后续发布步骤下载。
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPA-Route-Control-windows-x64
          path: ${{ runner.temp }}/cpa-route-control-windows-x64/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 拉取代码，用于读取 package.json 版本号。
      - name: Checkout
        uses: actions/checkout@v4

      # 下载上一步上传的 Windows 产物。
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      # 自动确定版本号，然后创建 GitHub Release 并上传 EXE。
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 如果是标签推送，直接用标签作为版本。
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          # 手动运行时如果填写了版本号，则使用填写值。
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          # 否则读取 package.json 自动生成版本号。
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          echo "Publishing release: $VERSION"

          # 创建 Release 并上传产物；如果 Release 已存在，则改为上传覆盖文件。
          gh release create "$VERSION" \
            release-artifacts/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes || \
          gh release upload "$VERSION" \
            release-artifacts/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
